# -Duser.language=en -Duser.country=US is NOT cosmetic: without it
# `flutter build appbundle` cannot produce an uploadable bundle on a machine
# whose system locale uses Arabic-Indic digits (this project's does, ar_BH).
#
# bundletool formats the dex index with the JVM's DEFAULT locale, so under
# ar_BH it renders 2 as the Arabic-Indic numeral ٢, then looks for a file
# that does not exist and fails the build:
#
#   > Invalid dex file indices, expecting file 'classes٢.dex'
#     but found 'classes2.dex'
#
# The APK path packages differently and is unaffected, so this shows up ONLY
# when building the App Bundle - i.e. only on the artifact Play actually
# requires. The same locale sensitivity breaks `sdkmanager --list`, which
# throws UnknownFormatConversionException under ar_BH.
#
# Forcing the toolchain's locale changes nothing about the app: the shipped
# app still follows the device locale and still ships both Arabic and
# English (see supportedLocales in lib/main.dart).
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
