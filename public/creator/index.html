<!--
  A creator's own page: what their code sold and what they earned.

  Each creator gets a private link from the admin tool's Creators page
  (Make statement link), shaped /creator/#k=<key>. The key rides in the
  #fragment, which a browser never sends to a server on its own, so it is in
  no log and no Referer. This page posts it to /api/creator-statement (the
  creatorStatement function, through the site's hosting rewrite in
  firebase.json) and draws the answer. Only the key's hash is stored, so a
  lost or leaked link is replaced by making a new one, which retires the old.

  /creator/#demo draws the same page from made-up numbers, marked as an
  example on screen: for showing a creator what they will get before they
  have a code, and for checking the layout.

  No dependencies, no fonts or scripts from anywhere else, and every value
  from the server goes in as text, never as markup.

  The Arabic is easy spoken Arabic with Latin digits, like the app. Aziz picks
  the final wording.
-->

  // ---- Language -------------------------------------------------------------

  function storedLang() {
    try { return window.localStorage.getItem(LANG_KEY); } catch (e) { return null; }
  }
  function storeLang(value) {
    try { window.localStorage.setItem(LANG_KEY, value); } catch (e) { /* private window */ }
  }
  var query = new URLSearchParams(window.location.search);
  var lang = (query.get('lang') || storedLang() || 'ar').slice(0, 2) === 'en' ? 'en' : 'ar';

  function t(key) { return T[lang][key]; }

  /**
   * A sentence with its {slots} filled. Each value is its own isolated run,
   * so a "$23.99" or a date inside an Arabic sentence keeps its own order.
   */
  function sentence(key, vars) {
    var frag = document.createDocumentFragment();
    var parts = t(key).split(/\{(\w+)\}/);
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 0) {
        if (parts[i]) frag.appendChild(document.createTextNode(parts[i]));
      } else {
        var value = vars && Object.prototype.hasOwnProperty.call(vars, parts[i]) ? vars[parts[i]] : '';
        frag.appendChild(el('bdi', null, String(value)));
      }
    }
    return frag;
  }

  // ---- Formats: Latin digits in both languages, day before month ---------------

  function money(cents) {
    var c = Math.round(Number(cents) || 0);
    var abs = Math.abs(c);
    return (c < 0 ? '-' : '') + '$' + Math.floor(abs / 100).toLocaleString('en-US') + '.' + String(abs % 100).padStart(2, '0');
  }
  function usd(amount) {
    return money(Math.round(Number(amount) * 100));
  }

  function day(ms) {
    return new Intl.DateTimeFormat(locale(), { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Bahrain' }).format(new Date(ms));

  // gone.
  function clock(ms) {
    return new Intl.DateTimeFormat(locale(), { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Bahrain' }).format(new Date(ms));
  }
  function shortDay(ms) {
    return new Intl.DateTimeFormat(locale(), { day: 'numeric', month: 'short', timeZone: 'Asia/Bahrain' }).format(new Date(ms));
  }
  function monthName(key) {
    var p = String(key).split('-');
    return new Intl.DateTimeFormat(locale(), { month: 'long', year: 'numeric', timeZone: 'UTC' })
      .format(new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, 15)));
  }
  function when(ms) {
    return new Intl.DateTimeFormat(locale(), {
      day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Bahrain'
    }).format(new Date(ms));
  }

  // ---- DOM ----------------------------------------------------------------------

  function el(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) {
      for (var name in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, name)) continue;
        var value = attrs[name];
        if (value === null || value === undefined || value === false) continue;
        if (name === 'class') node.className = value;
        else if (name.slice(0, 2) === 'on') node.addEventListener(name.slice(2), value);
        else node.setAttribute(name, String(value));
      }
    }
    for (var i = 2; i < arguments.length; i++) add(node, arguments[i]);
    return node;
  }
  function add(node, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { add(node, c); }); return; }
    node.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  function moneyNode(cents, cls) {
    return el('span', { class: 'ltr num' + (cls ? ' ' + cls : '') }, money(cents));
  }

  var toastTimer = null;
  function toast(message) {
    var box = document.getElementById('toast');
    box.textContent = message;
    box.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.classList.remove('on'); }, 2400);
  }
  function copyText(text) {
    var done = function () { toast(t('copied')); };
    var fail = function () { toast(t('copyFail')); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
    } else {
      fail();
    }
  }

  // ---- The page -------------------------------------------------------------------

  var state = { data: null, demo: false, error: null, showAll: false };

  function productName(id) {
    if (id === 'growdaily_lifetime' || id === 'growdaily_lifetime_offer') return t('lifetime');
    if (id && id.indexOf('growdaily_monthly') === 0) return t('monthly');
    return t('premium');
  }

  function renderMessage(titleKey, subKey, withRetry) {
    var box = el('div', { class: 'card screen-msg' },
      el('h1', null, t(titleKey)),
      el('p', null, t(subKey)),
      withRetry ? el('button', { class: 'btn', type: 'button', onclick: load }, t('retry')) : null,
      el('p', { class: 'foot' }, t('contact') + ' ', el('a', { href: 'mailto:' + SUPPORT, class: 'ltr' }, SUPPORT)));
    return box;
  }

  function heroCards(s) {
    var m = s.money;
    var lastPaid = s.payouts.length ? s.payouts[0].paidAtMs : null;
    return [
      el('section', { class: 'card hero', 'aria-labelledby': 'readyK' },
        el('div', { class: 'k', id: 'readyK' }, t('ready')),
        el('div', { class: 'big' }, moneyNode(m.owedCents)),
        el('p', { class: 's' }, sentence('readySub', { days: s.holdDays }))),
      el('div', { class: 'pair' },
        el('section', { class: 'card' },
          el('div', { class: 'k' }, t('waiting')),
          el('div', { class: 'mid' }, moneyNode(m.waitingCents)),
          el('p', { class: 's' }, m.waitingCents > 0 && m.nextReadyAtMs ? sentence('waitingNext', { date: day(m.nextReadyAtMs) }) : t('waitingNone'))),
        el('section', { class: 'card' },
          el('div', { class: 'k' }, t('paid')),
          el('div', { class: 'mid' }, moneyNode(m.paidCents)),
          el('p', { class: 's' }, lastPaid ? sentence('paidLast', { date: day(lastPaid) }) : t('paidNone'))))
    ];
  }

  function statsCard(s) {
    var c = s.counts;
    function stat(v, label) {
      return el('div', { class: 'stat' }, el('div', { class: 'v num' }, String(v)), el('div', { class: 'l' }, label));
    }
    return el('section', { class: 'card' },
      el('div', { class: 'stats' },
        stat(c.sales, t('statSales')),
        stat(c.sales30, t('stat30')),
        stat(c.refunds, t('statRefunds'))),
      c.needsReview ? el('p', { class: 's', style: 'margin-top:12px' }, sentence('review', { n: c.needsReview })) : null);
  }

  function dealCard(s) {
    var c = s.creator;
    var lines = [];
    if (c.offerPriceUsd !== null && c.discountPercent !== null) {
      lines.push(el('p', null, sentence('dealPrice', { price: usd(c.offerPriceUsd), pct: c.discountPercent })));
    }
    if (c.sharePercent !== null) lines.push(el('p', null, sentence('dealShare', { share: c.sharePercent })));
    if (!c.active) lines.push(el('p', { class: 'warn' }, t('dealPaused')));
    else if (c.codeEnded && c.codeEndsAtMs) lines.push(el('p', { class: 'warn' }, sentence('dealEnded', { date: day(c.codeEndsAtMs) })));
    else if (!c.hasAppleCode) lines.push(el('p', { class: 'warn' }, t('dealNotLive')));
    else if (c.codeEndsAtMs) lines.push(el('p', null, sentence('dealEnds', { date: day(c.codeEndsAtMs), time: clock(c.codeEndsAtMs) })));
    lines.push(el('p', { class: 's' }, t('dealIphone')));
    var usable = c.active && c.hasAppleCode && !c.codeEnded;
    return el('section', { class: 'card deal', 'aria-labelledby': 'dealH' },
      el('h2', { id: 'dealH' }, t('dealTitle')),
      lines,
      usable ? [
        el('div', { class: 'k', style: 'margin-top:14px' }, t('linkLabel')),
        el('div', { class: 'linkbox' },
          el('code', null, c.shareLink),
          el('button', { class: 'copy', type: 'button', onclick: function () { copyText(c.shareLink); } }, t('copy'))),
        el('p', { class: 'hint' }, t('linkHint'))
      ] : null);
  }

  function monthsCard(s) {
    if (!s.months.length) return null;
    var body = el('tbody');
    s.months.forEach(function (m) {
      add(body, el('tr', null,
        el('td', null, monthName(m.month)),
        el('td', { class: 'n num' }, String(m.sales)),
        el('td', { class: 'n num' }, String(m.refunds)),
        el('td', { class: 'n' }, moneyNode(m.shareCents, m.shareCents < 0 ? 'neg' : ''))));
    });
    return el('section', { class: 'card', 'aria-labelledby': 'monthsH' },
      el('h2', { id: 'monthsH' }, t('monthsTitle')),
      el('table', null,
        el('thead', null, el('tr', null,
          el('th', { scope: 'col' }, t('colMonth')),
          el('th', { scope: 'col', class: 'n' }, t('colSales')),
          el('th', { scope: 'col', class: 'n' }, t('colRefunds')),
          el('th', { scope: 'col', class: 'n' }, t('colShare')))),
        body));
  }

  function statusText(r) {
    if (r.status === 'waiting' && r.readyAtMs) return sentence('st_waiting', { date: shortDay(r.readyAtMs) });
    return t('st_' + r.status) || '';
  }

  function recentCard(s) {
    var rows = s.recent;
    var list = el('ul', { class: 'rows' });
    var shown = state.showAll ? rows : rows.slice(0, 8);
    shown.forEach(function (r) {
      var title = r.kind === 'refund' ? t('refundRow') + ' · ' + productName(r.productId) : productName(r.productId);
      var sub = [day(r.atMs)];
      add(list, el('li', null,
        el('div', null,
          el('div', { class: 't' }, title),
          el('div', { class: 'd' }, sub.join(' · '),
            r.priceUsd !== null && r.kind === 'sale' ? [' · ', sentence('paidAt', { price: usd(r.priceUsd) })] : null)),
        el('div', { class: 'end' },
          el('div', { class: 'amt' }, r.shareCents === null ? el('span', { class: 'ltr' }, '?')
            : moneyNode(r.shareCents, r.status === 'refunded' ? 'void' : r.shareCents < 0 ? 'neg' : '')),
          el('span', { class: 'chip ' + r.status }, statusText(r)))));
    });
    return el('section', { class: 'card', 'aria-labelledby': 'recentH' },
      el('h2', { id: 'recentH' }, t('recentTitle')),
      rows.length ? list : el('p', { class: 'muted' }, t('noSales')),
      rows.length > shown.length ? el('button', {
        class: 'more', type: 'button', onclick: function () { state.showAll = true; render(); }
      }, t('showMore')) : null);
  }

  function payoutsCard(s) {
    var list = el('ul', { class: 'rows' });
    s.payouts.forEach(function (p) {
      add(list, el('li', null,
        el('div', null,
          el('div', { class: 't' }, p.paidAtMs ? day(p.paidAtMs) : ''),
          p.note ? el('div', { class: 'd' }, p.note) : null),
        el('div', { class: 'end' }, el('div', { class: 'amt' }, moneyNode(p.amountCents)))));
    });
    return el('section', { class: 'card', 'aria-labelledby': 'payH' },
      el('h2', { id: 'payH' }, t('payoutsTitle')),
      s.payouts.length ? list : el('p', { class: 'muted' }, t('noPayouts')));
  }

  function howCard(s) {
    var share = s.creator.sharePercent === null ? '?' : s.creator.sharePercent;
    return el('details', { class: 'card how' },
      el('summary', null, t('howTitle')),
      el('ul', null,
        el('li', null, sentence('how1', { share: share })),
        el('li', null, sentence('how2', { days: s.holdDays })),
        el('li', null, t('how3')),
        el('li', null, t('how4')),
        el('li', null, t('how5'))));
  }

  function render() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t('title');
    document.getElementById('kicker').textContent = t('kicker');
    var langBtn = document.getElementById('lang');
    langBtn.textContent = t('other');
    langBtn.setAttribute('lang', lang === 'ar' ? 'en' : 'ar');

    var main = document.getElementById('main');
    while (main.firstChild) main.removeChild(main.firstChild);

    if (state.error) {
      if (state.error === 'dead') add(main, renderMessage('deadTitle', 'deadSub', false));
      else if (state.error === 'nokey') add(main, renderMessage('noKeyTitle', 'noKeySub', false));
      else add(main, renderMessage('netTitle', 'netSub', true));
      return;
    }
    var s = state.data;
    if (!s) {
      add(main, el('p', { class: 'muted' }, t('loading')));
      return;
    }
    var c = s.creator;
    add(main, [
      state.demo ? el('div', { class: 'demo', role: 'note' }, t('demo')) : null,
      el('h1', null, c.name ? sentence('hello', { name: c.name }) : t('helloNoName')),
      el('div', { class: 'codeline' }, t('yourCode'), el('span', { class: 'code' }, c.code)),
      heroCards(s),
      statsCard(s),
      dealCard(s),
      monthsCard(s),
      recentCard(s),
      payoutsCard(s),
      howCard(s),
      el('p', { class: 'foot' },
        sentence('updated', { time: when(s.nowMs) }), el('br'),
        t('private'), el('br'),
        t('contact') + ' ', el('a', { href: 'mailto:' + SUPPORT, class: 'ltr' }, SUPPORT))
    ]);
  }

  // ---- Data -------------------------------------------------------------------------

  function keyFromHash() {
    var hash = window.location.hash.replace(/^#/, '');
    if (hash === 'demo') return 'demo';
    var params = new URLSearchParams(hash);
    var key = params.get('k') || '';
    return /^[A-Za-z0-9_-]{43}$/.test(key) ? key : null;
  }

  function demoStatement() {
    var now = Date.now();
    var d = 86400000;
    function r(kind, age, share, status, price, product) {
      return {
        atMs: now - age * d, kind: kind, productId: product || 'growdaily_lifetime_offer', store: 'APP_STORE',
        priceUsd: price, shareCents: share, status: status, readyAtMs: status === 'waiting' ? now + (60 - age) * d : null
      };
    }
    return {
      creator: {
        name: lang === 'ar' ? 'سارة' : 'Sara', code: 'SARA', sharePercent: 25, discountPercent: 20, offerPriceUsd: 23.99,
        // A real end is midnight Pacific; 08:00 UTC is that in winter.
        codeEndsAtMs: Math.floor((now + 150 * d) / d) * d + 8 * 60 * 60 * 1000, codeEnded: false, active: true, hasAppleCode: true,
        shareLink: 'https://apps.apple.com/redeem?ctx=offercodes&id=6788149393&code=SARA'
      },
      money: { earnedCents: 6720, paidCents: 2940, owedCents: 1680, waitingCents: 2100, nextReadyAtMs: now + 9 * d },
      counts: { sales: 17, refunds: 1, sales30: 5, refunds30: 0, needsReview: 0 },
      months: [
        { month: new Date(now).toISOString().slice(0, 7), sales: 5, refunds: 0, shareCents: 2100 },
        { month: new Date(now - 31 * d).toISOString().slice(0, 7), sales: 8, refunds: 1, shareCents: 2940 },
        { month: new Date(now - 62 * d).toISOString().slice(0, 7), sales: 4, refunds: 0, shareCents: 1680 }
      ],
      recent: [
        r('sale', 2, 420, 'waiting', 23.99),
        r('sale', 6, 420, 'waiting', 23.99),
        r('sale', 11, 420, 'waiting', 23.99),
        r('refund', 20, -420, 'refund', -23.99),
        r('sale', 51, 420, 'waiting', 23.99),
        r('sale', 55, 420, 'refunded', 23.99),
        r('sale', 64, 420, 'cleared', 23.99),
        r('sale', 70, 420, 'cleared', 23.99)
      ],
      payouts: [{ paidAtMs: now - 12 * d, amountCents: 2940, note: lang === 'ar' ? 'تحويل بنكي' : 'Bank transfer' }],
      holdDays: 60,
      nowMs: now
    };
  }

  function load() {
    state.error = null;
    var key = keyFromHash();
    if (key === 'demo') {
      state.demo = true;
      state.data = demoStatement();
      render();
      return;
    }
    if (!key) {
      state.error = 'nokey';
      render();
      return;
    }
    state.data = null;
    render();
    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key }),
      cache: 'no-store',
      credentials: 'omit',
      referrerPolicy: 'no-referrer'
    }).then(function (res) {
      if (res.status === 404) { state.error = 'dead'; return null; }
      if (!res.ok) { state.error = 'net'; return null; }
      return res.json();
    }).then(function (body) {
      if (body && body.ok && body.statement) state.data = body.statement;
      else if (!state.error) state.error = 'net';
      render();
    }).catch(function () {
      state.error = 'net';
      render();
    });
  }

  document.getElementById('lang').addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    storeLang(lang);
    if (state.demo) state.data = demoStatement();
    render();
  });
  window.addEventListener('hashchange', function () { state.showAll = false; state.demo = false; load(); });

  load();
})();
</script>
</body>
</html>
