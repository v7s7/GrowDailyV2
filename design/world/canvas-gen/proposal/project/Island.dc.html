    const fx = { gx: g ? g.gx : 0, gy: g ? g.gy : 0, go: g ? 0.9 : 0, spark: !!target,
      sx: target ? (target.box.x + target.box.w - 14) * u : 0, sy: target ? (target.box.y - 10) * u : 0, sw: 30 * u };

    const say = o.say ? { show: true, text: o.say, x: (o.sayAt ? o.sayAt[0] : at[0]) * u, y: ((o.sayAt ? o.sayAt[1] : at[1] - 66 - 10)) * u, fs: Math.min(16, Math.max(11, 13 * u)) }
      : { show: false, text: '', x: 0, y: 0, fs: 13 };
    const pennant = { show: !!o.pennant && !glance };
    return { S, H, u, v, tr, pl, f, items, glows, fx, tier, dm, bursts, tags, say, pennant, boxes, pbox: pb, extraBoxes,
      alt: 'واحة دوم، المستوى ' + L };
  }


  autoSpots(L) {
    // buildings in the back two places, tall things in the back or middle, low things anywhere
    const AUTO = [[2, 4, 'flowers'], [6, 5, 'bench'], [7, 0, 'lemon'], [8, 3, 'well'], [9, 2, 'jasmine'],
      [13, 4, 'rose'], [15, 1, 'house'], [16, 0, 'pomegranate'], [17, 5, 'vegetables'],
      [20, 1, 'coral_house'], [24, 3, 'rose_arch'], [27, 2, 'vine'], [35, 2, 'fountain'], [40, 3, 'palm'],
      [50, 4, 'pearl_chest'], [75, 0, 'majlis']];
    const s = ['', '', '', '', '', ''];
    for (const [lv, i, name] of AUTO) if (L >= lv) s[i] = name;
    return s;
  }

  renderVals() {
    const P = this.props;
    const num = (v, d) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
    const yes = (v) => v === true || v === 'true';
    const PAL = {doum: { name: 'دوم', sky: '#DDF0F1', grass: '#93CC62', sea: '#86CBE6', sand: '#F1D9A4' }, evening: { name: 'عصر', sky: '#F7E3C8', grass: '#9CC65E', sea: '#7FC0D8', sand: '#F0D29A' }, pink: { name: 'وردي', sky: '#FCE6EE', grass: '#A6D27A', sea: '#9FD3E6', sand: '#F4DDB8' }, violet: { name: 'بنفسجي', sky: '#E6E0F6', grass: '#9BCB78', sea: '#93BFEA', sand: '#EED9B4' }, emerald: { name: 'زمرد', sky: '#DCEFE6', grass: '#6FBF7A', sea: '#6CC0C8', sand: '#EAD3A0' }, ocean: { name: 'بحري', sky: '#D3ECF4', grass: '#8ED39A', sea: '#4FB2DA', sand: '#F2DDAE' }};
    const L = Math.max(1, Math.min(100, Math.round(num(P.level, 24))));
    const given = String(P.spots ?? '').split(',').map((x) => x.trim());
    const spots = given.length === 6 ? given : this.autoSpots(L);
    const fr = String(P.fresh ?? 'none');
    const w = this.island({
      level: L, medals: num(P.medals, 6), pearls: num(P.pearls, 2), thirst: num(P.thirst, 0),
      quietStyle: P.quietStyle ?? 'thirsty', sky: P.sky ?? 'day', watering: yes(P.watering), glowing: yes(P.glowing), season: P.season ?? 'none',
      fresh: fr === 'palm' ? 'palm' : fr === 'none' ? -1 : num(fr, -1), sel: -1, pose: P.pose ?? 'auto',
      colors: PAL[P.palette] || PAL.doum, frame: P.frame ?? 'rect', detail: P.detail ?? 'full',
      size: num(P.size, 360), spots,
      gifts: String(P.gifts ?? '').split(',').filter((x) => x.includes(':')).map((x) => { const [name, from] = x.split(':'); return { name: name.trim(), from: from.trim() }; }),
      guest: yes(P.guest), guestName: P.guestName ?? '', pennant: yes(P.pennant)
    });
    return { w };
  }
}
