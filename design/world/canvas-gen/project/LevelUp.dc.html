<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = '#45BA50', E = '#EAE4D3', F = '#F4F0E5';
    const names = ['صلاة الفجر', 'أذكار الصباح', 'قراءة', 'مشي', 'شرب ماء', 'نوم بدري'];
    const marks = [[2, 1, 1, 1, 1, 0, 1], [2, 1, 1, 1, 1, 1, 0], [2, 0, 1, 0, 1, 1, 1], [2, 1, 1, 1, 0, 1, 1], [2, 1, 1, 1, 1, 1, 1], [2, 0, 1, 1, 1, 0, 1]];
    return {
      rows: names.map((name, r) => ({ name, sq: marks[r].map((m, i) => ({ bg: m === 1 ? G : (m === 2 ? F : E), ring: i === 1 ? '0 0 0 2px #23352A' : 'none' })) }))
    };
  }
}
</script>
