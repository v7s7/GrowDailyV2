</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"><div style="background: #FFFFFF; border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 6px; box-shadow: {{vt.r0}};"><div style="border-radius: 14px; overflow: hidden; width: 155px; height: 172px; align-self: center;"><dc-import name="Island" frame="rect" pose="none" level="31" medals="11" pearls="3" spots="pomegranate,coral_house,jasmine,well,lantern_arch,rose" size="155" hint-size="155px,172px"></dc-import></div><div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px;"><span style="font-size: 15px; font-weight: 700;">خالد</span><span style="font-size: 12px; color: #6B7A6F;">المستوى 31</span></div><button type="button" onClick="{{vt.v0}}" style="font-family: inherit; font-size: 14px; font-weight: 700; color: {{vt.fg0}}; background: {{vt.bg0}}; border: 0; border-radius: 12px; min-height: 40px; cursor: pointer;">{{vt.t0}}</button></div><div style="background: #FFFFFF; border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 6px; box-shadow: {{vt.r1}};"><div style="border-radius: 14px; overflow: hidden; width: 155px; height: 172px; align-self: center;"><dc-import name="Island" frame="rect" pose="none" level="52" medals="17" pearls="5" spots="sidr,coral_house,vine,falaj,fountain,pearl_chest" size="155" hint-size="155px,172px"></dc-import></div><div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px;"><span style="font-size: 15px; font-weight: 700;">يوسف</span><span style="font-size: 12px; color: #6B7A6F;">المستوى 52</span></div><button type="button" onClick="{{vt.v1}}" style="font-family: inherit; font-size: 14px; font-weight: 700; color: {{vt.fg1}}; background: {{vt.bg1}}; border: 0; border-radius: 12px; min-height: 40px; cursor: pointer;">{{vt.t1}}</button></div><div style="background: #FFFFFF; border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 6px; box-shadow: {{vt.r2}};"><div style="border-radius: 14px; overflow: hidden; width: 155px; height: 172px; align-self: center;"><dc-import name="Island" frame="rect" pose="none" level="8" medals="2" pearls="1" spots="" size="155" hint-size="155px,172px"></dc-import></div><div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px;"><span style="font-size: 15px; font-weight: 700;">أحمد</span><span style="font-size: 12px; color: #6B7A6F;">المستوى 8</span></div><button type="button" onClick="{{vt.v2}}" style="font-family: inherit; font-size: 14px; font-weight: 700; color: {{vt.fg2}}; background: {{vt.bg2}}; border: 0; border-radius: 12px; min-height: 40px; cursor: pointer;">{{vt.t2}}</button></div><div style="background: #FFFFFF; border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 6px; box-shadow: {{vt.r3}};"><div style="border-radius: 14px; overflow: hidden; width: 155px; height: 172px; align-self: center;"><dc-import name="Island" frame="rect" pose="none" level="15" medals="5" pearls="2" spots="lemon,house,flowers,well,rose,bench" size="155" hint-size="155px,172px"></dc-import></div><div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px;"><span style="font-size: 15px; font-weight: 700;">عبدالله</span><span style="font-size: 12px; color: #6B7A6F;">المستوى 15</span></div><button type="button" onClick="{{vt.v3}}" style="font-family: inherit; font-size: 14px; font-weight: 700; color: {{vt.fg3}}; background: {{vt.bg3}}; border: 0; border-radius: 12px; min-height: 40px; cursor: pointer;">{{vt.t3}}</button></div></div>

<svg width="34" height="40" viewBox="0 0 34 40" aria-hidden="true"><line x1="8" y1="4" x2="8" y2="38" stroke="#F5F0E1" stroke-width="2.6" stroke-linecap="round"></line><path d="M9 5 L32 12 L9 20 Z" fill="#F2C14E" stroke="#F5F0E1" stroke-width="1.6" stroke-linejoin="round"></path></svg>
<div style="display: flex; flex-direction: column;"><span style="font-size: 15px; font-weight: 700;">الأسبوع الماضي: علم المعرض لخالد</span><span style="font-size: 13px; color: #C9D6C9;">يرفرف على واحته أسبوع، ويشوفه كل من يزوره</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

class Component extends DCLogic {
  renderVals() {
    const st = Object.assign({ vote: 1 }, this.state || {});
    const vt = {};
    for (let i = 0; i < 4; i++) {
      const on = st.vote === i;
      vt['v' + i] = () => this.setState({ vote: on ? -1 : i });
      vt['t' + i] = on ? 'صوّتّ لها' : 'صوّت';
      vt['bg' + i] = on ? '#2F7A3A' : '#F3EEDF';
      vt['fg' + i] = on ? '#FFFFFF' : '#23352A';
      vt['r' + i] = on ? '0 0 0 3px #2F7A3A' : 'none';
    }
    return { vt };
  }
}

</script>
