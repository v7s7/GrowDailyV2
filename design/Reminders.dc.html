<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; }
    a { color: #D6C429; } a:hover { color: #E4D45A; }
  </style>
</helmet>
<div dir="rtl" style="width: 402px; height: 874px; background: #070C10; color: #FFFFFF; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">

  <div style="padding: 0 16px 16px 16px">
    <div style="background: #161D24; border-radius: 22px; padding: 16px 20px 20px 20px; display: flex; flex-direction: column">
      <div style="width: 36px; height: 4px; border-radius: 100px; background: #2D3740; align-self: center; margin-bottom: 18px"></div>

      <div style="font-size: 12px; font-weight: 700; color: #B0B7C3; letter-spacing: 1px; margin-bottom: 4px">التذكير</div>
      <div style="font-size: 11.5px; color: #7A796F; margin-bottom: 12px">٤ مرات في اليوم، فتقدر تحط لكل وحدة وقتها.</div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{times}}" as="t" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #10161B; border: 1px solid {{t.ring}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.icon}}" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
              <div style="font-size: 13.5px; font-weight: 700; color: #FFFFFF; direction: ltr; text-align: right">{{t.clock}}</div>
              <sc-if value="{{t.note}}" hint-placeholder-val="{{ true }}">
                <div style="font-size: 10.5px; color: {{t.noteTint}}; line-height: 1.4">{{t.note}}</div>
              </sc-if>
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A796F" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </div>
        </sc-for>
      </div>

      <div style="margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 12px; border: 1px dashed #2D3740; font-size: 12px; font-weight: 600; color: #B0B7C3">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B0B7C3" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        أضف وقت
      </div>

      <div style="margin-top: 14px; display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(247,201,72,0.09); border: 1px solid rgba(247,201,72,0.35)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F7C948" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l9 16H3z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="16" x2="12" y2="16"></line></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 11.5px; color: #B0B7C3; line-height: 1.45">وقت ١:٣٠ ص يقع ضمن ساعات الهدوء، فما راح يوصلك.</div>
          <div style="align-self: flex-start; padding: 7px 12px; border-radius: 100px; background: rgba(247,201,72,0.16); font-size: 11px; font-weight: 700; color: #F7C948">اسمح به على أي حال</div>
        </div>
      </div>

      <div style="height: 18px"></div>
      <div style="height: 48px; border-radius: 12px; background: #D6C429; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #070C10">حفظ</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const row = (clock, opts) => ({
      clock,
      ring: opts.warn ? 'rgba(247,201,72,0.45)' : '#2D3740',
      icon: opts.warn ? '#F7C948' : '#589CDE',
      note: opts.note ?? '',
      noteTint: opts.warn ? '#F7C948' : '#7A796F',
    });
    return {
      times: [
        row('١:٣٠ ص', { warn: true, note: 'داخل ساعات الهدوء' }),
        row('٧:٣٠ ص', {}),
        row('١:٣٠ م', {}),
        row('٧:٣٠ م', {}),
      ],
    };
  }
}
</script>
</body>
</html>
