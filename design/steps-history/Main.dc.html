<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #07100D; font-family: 'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Segoe UI', Arial, sans-serif; }
    a { color: #E4B45F; } a:hover { color: #F0CB86; }
  </style>
</helmet>
<div dir="rtl" style="width: 402px; height: 300px; background: #07100D; color: #F7F3E8; padding: 20px 16px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: flex-start">
    <div style="width: 77.7px; flex-shrink: 0"></div>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <div style="padding-left: 5px">
        <div style="width: 36px; display: flex; flex-direction: column; align-items: center">
          <div style="height: 12px; font-size: 10px; line-height: 12px; font-weight: 700; letter-spacing: 0.2px; white-space: nowrap; color: {{d.ink}}">{{d.ar}}</div>
          <div style="height: 10px; margin-top: 1px; font-size: 8px; line-height: 10px; font-weight: 600; letter-spacing: 0.2px; color: {{d.inkSoft}}">{{d.en}}</div>
          <div style="width: 22px; height: 22px; margin-top: 3px; border-radius: 50%; background: {{d.circle}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: {{d.weight}}; color: {{d.num}}">{{d.n}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="height: 12px"></div>

  <div style="display: flex; flex-direction: column; gap: 5px">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
      <div style="height: 56px; display: flex; align-items: center">
        <div style="width: 77.7px; flex-shrink: 0; box-sizing: border-box; padding-left: 8px; display: flex; align-items: center; gap: 6px">
          <div style="position: relative; width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px; background: {{row.tile}}; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{row.book}}" hint-placeholder-val="{{ true }}">
              <svg width="13" height="13" viewBox="0 0 24 24"><path fill="#2ECF8F" d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"></path></svg>
            </sc-if>
            <sc-if value="{{row.fit}}" hint-placeholder-val="{{ false }}">
              <svg width="13" height="13" viewBox="0 0 24 24"><path fill="#FF8A4C" d="M20.57 14.86 22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"></path></svg>
              <div style="position: absolute; left: -3px; bottom: -3px; width: 11px; height: 11px; box-sizing: border-box; border-radius: 50%; background: #2ECF8F; border: 1.2px solid #101B17; display: flex; align-items: center; justify-content: center">
                <svg width="7" height="7" viewBox="0 0 24 24"><path fill="#FFFFFF" d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"></path></svg>
              </div>
            </sc-if>
          </div>
          <div style="font-size: 11.5px; font-weight: 600; line-height: 1.15; color: #F7F3E8">{{row.name}}</div>
        </div>
        <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="7">
          <div style="padding-left: 5px">
            <div style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 9px; border: 0.8px solid {{c.border}}; background: {{c.bg}}; opacity: {{c.op}}; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">
              <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{c.fill}}; background: {{c.fillBg}}"></div>
              <div style="position: absolute; left: 0; right: 0; bottom: {{c.fill}}; height: 1px; background: {{c.line}}"></div>
              <sc-if value="{{c.check}}" hint-placeholder-val="{{ false }}">
                <svg width="18" height="18" viewBox="0 0 24 24" style="position: relative"><path fill="#2ECF8F" d="M9 16.17 5.53 12.7a.996.996 0 1 0-1.41 1.41l4.18 4.18c.39.39 1.02.39 1.41 0L20.29 7.71a.996.996 0 1 0-1.41-1.41L9 16.17z"></path></svg>
              </sc-if>
              <sc-if value="{{c.num}}" hint-placeholder-val="{{ false }}">
                <div dir="ltr" style="position: relative; font-size: 11px; font-weight: 700; letter-spacing: -0.2px; line-height: 1; color: {{c.ink}}">{{c.num}}</div>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":402,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const gold = '#E4B45F';
    const day = (ar, en, n, today) => ({
      ar, en, n,
      ink: today ? gold : '#6F7A70',
      inkSoft: today ? gold : 'rgba(111,122,112,0.75)',
      circle: today ? 'rgba(228,180,95,0.16)' : 'transparent',
      num: today ? gold : '#B5BCA8',
      weight: today ? 700 : 600,
    });
    const base = { border: '#2D4037', bg: '#2B2B2B', op: 1, fill: '0%', fillBg: 'transparent', line: 'transparent', check: false, num: '', ink: '#B5BCA8' };
    const ring = (c) => ({ ...c, border: '#9C7436' });
    const none = () => ({ ...base });
    const future = () => ({ ...base, op: 0.35 });
    const done = () => ({ ...base, bg: 'rgba(46,207,143,0.34)', border: 'rgba(46,207,143,0.55)', check: true });
    const half = () => ({ ...base, bg: 'rgba(247,201,72,0.30)', border: 'rgba(247,201,72,0.55)', fill: '50%', fillBg: 'rgba(247,201,72,0.30)', line: '#F7C948' });
    // Steps row: the count sits where the glyph was. The fill keeps its
    // colour but loses its 1pt line, so the digits are never struck through.
    const sDone = (num) => ({ ...base, bg: 'rgba(46,207,143,0.34)', border: 'rgba(46,207,143,0.55)', num, ink: '#2ECF8F' });
    const sBonus = (num) => ({ ...base, bg: 'rgba(93,173,236,0.32)', border: 'rgba(93,173,236,0.55)', num, ink: '#5DADEC' });
    const sHalf = (num) => ({ ...base, bg: 'rgba(247,201,72,0.30)', border: 'rgba(247,201,72,0.55)', fill: '50%', fillBg: 'rgba(247,201,72,0.30)', num, ink: '#F7F3E8' });
    const sPart = (num, pct) => ({ ...base, fill: pct, fillBg: 'rgba(247,201,72,0.30)', num, ink: '#F7F3E8' });
    return {
      days: [
        day('السبت', 'Sat', '12', false),
        day('الأحد', 'Sun', '13', false),
        day('الاثنين', 'Mon', '14', false),
        day('الثلاثاء', 'Tue', '15', false),
        day('الأربعاء', 'Wed', '16', true),
        day('الخميس', 'Thu', '17', false),
        day('الجمعة', 'Fri', '18', false),
      ],
      rows: [
        { name: 'سورة الملك', tile: 'rgba(46,207,143,0.14)', book: true, fit: false,
          cells: [done(), done(), done(), none(), ring(done()), future(), future()] },
        { name: 'المشي اليومي', tile: 'rgba(255,138,76,0.14)', book: false, fit: true,
          cells: [sDone('9.1k'), sPart('3.2k', '40%'), sBonus('10k'), sHalf('5.4k'), ring(sPart('2.7k', '34%')), future(), future()] },
        { name: 'أذكار الصباح', tile: 'rgba(46,207,143,0.14)', book: true, fit: false,
          cells: [done(), half(), done(), done(), ring(none()), future(), future()] },
      ],
    };
  }
}
</script>
</body>
</html>
